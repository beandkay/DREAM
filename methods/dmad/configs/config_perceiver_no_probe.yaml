text_strategies: [cot, sbp, pot]
multimodal_strategies: [io, ccot, ddcot]
max_round: 3
agent_temperature: 0.5
judge_temperature: 0.5
return_all: true

# Static resolution (no probing)
routing_strategy: "consensus_scaling"
resolutions: ["1x"]

# Perceiver settings
use_perceiver: true
perceiver_temperature: 0.2
